<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpookCam</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-head">
      <div>
        <h1 class="wordmark">SpookCam</h1>
        <div class="hint" id="site"></div>
      </div>
      <div id="master"></div>
    </header>
    <main id="controls"></main>
    <footer class="popup-foot">
      <button class="btn" id="studio" type="button">Open preview studio</button>
      <span class="hint"><kbd>Alt</kbd> <kbd>⇧</kbd> <kbd>S</kbd> snaps from any tab</span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
