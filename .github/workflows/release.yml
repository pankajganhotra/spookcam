name: Release

# Push a tag like v1.2.0 (matching manifest.json / package.json) to build the extension
# and attach spookcam-v1.2.0.zip to a GitHub release.
on:
  push:
    tags: ['v*']
  # Manual run: build and keep the zip as a workflow artifact, without touching any release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (downloads MediaPipe models via postinstall)
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Package first: the build generates src/engine/vendor/mediapipe-loader.js, which typecheck needs.
      - name: Package
        run: npm run package
      - run: npm run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: spookcam-extension
          path: release/*.zip
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./manifest.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber \
            || gh release create "$GITHUB_REF_NAME" release/*.zip --title "SpookCam $GITHUB_REF_NAME" --generate-notes
